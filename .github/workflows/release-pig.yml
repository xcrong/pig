# pig fork 的 tag 自动构建 + 发布。
#
# 分支隔离说明：main 分支是上游 grok-build 的镜像，里面没有这个文件；
# GitHub Actions 只会运行 tag 所指提交树里存在的工作流，因此 main 上打的
# tag 不会触发这里。只有从 pig 分支打出的 `v*` tag 会触发。
#
# 用法：git tag v1.0.1 && git push origin v1.0.1
# pig 使用独立版本号，不跟随上游版本；需要对齐上游时再整体 bump。
# tag 后缀即
# crates/codegen/xai-grok-pager-bin/Cargo.toml 的 version。
# 它会被注入为 GROK_VERSION 编进二进制（`pig --version` 可见）。

name: pig release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 发版目标收缩到 linux x64 + mac arm64（2026-09 起）。
        # ubuntu-arm / mac-intel / windows 暂不发版：windows 还会触发上游
        # Cargo.lock 里 find-msvc-tools 0.1.13 与 cc 1.2.48 的不兼容问题，
        # 等上游 lock 修复或有人需要时再加回来。
        include:
          - runner: ubuntu-24.04
            artifact: pig-linux-x86_64.tar.gz
          - runner: macos-14
            artifact: pig-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：pager-bin 的 build.rs 用 git 嵌提交短哈希做版本戳
          fetch-depth: 0

      - name: Resolve version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "GROK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building pig $VERSION"

      - name: Install protoc (Linux)
        if: startsWith(runner.os, 'Linux')
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: startsWith(runner.os, 'macOS')
        run: brew install protobuf

      - name: Install Rust toolchain
        # 遵循仓库根目录 rust-toolchain.toml 的版本 pin
        uses: dtolnay/rust-toolchain@stable

      - name: Pre-fetch ripgrep (retryable)
        # xai-grok-shell / xai-grok-tools 的 build.rs 会在 release 构建时现下
        # ripgrep，且没有重试：runner 网络一抖就挂（pig-v1.0.41 macos-14 的失败原因）。
        # 这里用自带重试的 curl 提前下好，走上游官方支持的 *_BUNDLE_RG_PATH 覆盖机制，
        # 产物与在线下载的字节一致。版本号从 build.rs 解析，上游升级 rg 版本时自动跟随。
        # 改动只在这个 fork 自有的 workflow 文件里，不碰 crates/ 与 Cargo.lock。
        shell: bash
        run: |
          case "${{ matrix.runner }}" in
            ubuntu-24.04) TRIPLE=x86_64-unknown-linux-musl ;;
            macos-14) TRIPLE=aarch64-apple-darwin ;;
            *) echo "unsupported runner: ${{ matrix.runner }}"; exit 1 ;;
          esac
          SHELL_VER=$(sed -n 's/^const RG_VER: &str = "\(.*\)";/\1/p' crates/codegen/xai-grok-shell/build.rs)
          TOOLS_VER=$(sed -n 's/^const RG_VER: &str = "\(.*\)";/\1/p' crates/codegen/xai-grok-tools/build.rs)
          [ -n "$SHELL_VER" ] || { echo "cannot parse RG_VER from xai-grok-shell/build.rs"; exit 1; }
          [ -n "$TOOLS_VER" ] || { echo "cannot parse RG_VER from xai-grok-tools/build.rs"; exit 1; }
          mkdir -p /tmp/rg-prefetch
          fetch_rg() { # $1 = version -> prints extracted rg path
            local ver=$1 dir=/tmp/rg-prefetch/$ver-$TRIPLE
            mkdir -p "$dir"
            if [ ! -f "$dir/rg" ]; then
              curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 5 \
                -fsSL -o /tmp/rg-prefetch/ripgrep-$ver-$TRIPLE.tar.gz \
                "https://github.com/BurntSushi/ripgrep/releases/download/$ver/ripgrep-$ver-$TRIPLE.tar.gz"
              tar -xzf /tmp/rg-prefetch/ripgrep-$ver-$TRIPLE.tar.gz -C "$dir"
            fi
            find "$dir" -name rg -type f | head -n 1
          }
          echo "GROK_SHELL_BUNDLE_RG_PATH=$(fetch_rg "$SHELL_VER")" >> "$GITHUB_ENV"
          echo "GROK_TOOLS_BUNDLE_RG_PATH=$(fetch_rg "$TOOLS_VER")" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release -p xai-grok-pager-bin

      - name: Package
        shell: bash
        run: |
          cd target/release
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.artifact }}" pig

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: pig-*

  # npm publish for `@xcrong/pig` (scaffold in `npm/pig/`).
  #
  # OIDC trusted publishing: the npm package trusts this repo + workflow + environment
  # (configured on the npm website), so no long-lived token/secret is used here.
  # `id-token: write` mints the OIDC token; `npm publish --provenance` attaches it.
  # Runs after `release` so a published npm version never points at a tag whose
  # binaries failed to attach.
  publish-npm:
    name: publish npm @xcrong/pig
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Use npm with OIDC support
        # Trusted publishing needs npm >= 11.5.1; the Node 20 bundle ships npm 10.
        run: npm install -g npm@latest

      - name: Align package version with tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./npm/pig/package.json').name")" = "@xcrong/pig"
          npm version --no-git-tag-version --allow-same-version "$VERSION" --prefix npm/pig
          test "$(node -p "require('./npm/pig/package.json').version")" = "$VERSION"

      - name: Publish to npm (OIDC trusted publisher)
        working-directory: npm/pig
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag alpha
          else
            npm publish --provenance --access public
          fi
